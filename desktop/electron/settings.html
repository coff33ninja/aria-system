<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { font-size: 24px; font-weight: 600; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: rgba(255,255,255,0.05); border: none; border-radius: 8px; color: #aaa; cursor: pointer; transition: all 0.2s; }
        .tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .tab.active { background: #ff6b9d; color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .section h3 { font-size: 16px; margin-bottom: 16px; color: #ff6b9d; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { display: flex; flex-direction: column; gap: 4px; }
        .setting-label span { font-size: 14px; }
        .setting-label small { font-size: 11px; color: #888; }
        select, input[type="number"], input[type="text"] { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 14px; }
        select { min-width: 150px; }
        input[type="range"] { width: 150px; }
        .toggle { position: relative; width: 50px; height: 26px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.1); border-radius: 26px; transition: 0.3s; }
        .toggle-slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
        .toggle input:checked + .toggle-slider { background: #ff6b9d; }
        .toggle input:checked + .toggle-slider:before { transform: translateX(24px); }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: #ff6b9d; color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn:hover { transform: translateY(-1px); opacity: 0.9; }
        .footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
        .monitor-list { display: flex; flex-direction: column; gap: 8px; }
        .monitor-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .monitor-preview { width: 60px; height: 40px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .hotkey-input { display: flex; gap: 8px; align-items: center; }
        .hotkey-input input { width: 180px; text-align: center; }
        .hotkey-input .btn { padding: 8px 12px; }
    </style>
</head>
<body>
    <div class="header"><span>⚙️</span><h1>Aria Desktop Settings</h1></div>
    <div class="tabs">
        <button class="tab active" data-tab="general">General</button>
        <button class="tab" data-tab="display">Display</button>
        <button class="tab" data-tab="movement">Movement</button>
        <button class="tab" data-tab="hotkeys">Hotkeys</button>
        <button class="tab" data-tab="advanced">Advanced</button>
    </div>
    <div id="general" class="tab-content active"></div>
    <div id="display" class="tab-content"></div>
    <div id="movement" class="tab-content"></div>
    <div id="hotkeys" class="tab-content"></div>
    <div id="advanced" class="tab-content"></div>
    <div class="footer">
        <button class="btn btn-secondary" id="btn-reset">Reset to Defaults</button>
        <button class="btn btn-primary" id="btn-save">Save & Close</button>
    </div>
    <script src="settings.js"></script>
</body>
</html>
