<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Accessibility improvements */
        :focus {
            outline: 2px solid #ff6b9d;
            outline-offset: 2px;
        }
        
        /* High contrast mode support */
        @media (prefers-contrast: high) {
            body {
                background: #000000;
                color: #ffffff;
            }
            
            .section {
                background: #111111;
                border: 1px solid #ffffff;
            }
            
            .tab {
                background: #222222;
                border: 1px solid #ffffff;
            }
            
            .tab.active {
                background: #ffffff;
                color: #000000;
            }
        }
        
        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        .header { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 24px; 
            padding-bottom: 16px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
        }
        
        .header h1 { 
            font-size: 24px; 
            font-weight: 600; 
        }
        
        .tabs { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 20px; 
            role: tablist;
        }
        
        .tab { 
            padding: 10px 20px; 
            background: rgba(255,255,255,0.05); 
            border: none; 
            border-radius: 8px; 
            color: #aaa; 
            cursor: pointer; 
            transition: all 0.2s;
            role: tab;
            tabindex: -1;
        }
        
        .tab:hover { 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
        }
        
        .tab.active { 
            background: #ff6b9d; 
            color: #fff;
            tabindex: 0;
        }
        
        .tab-content { 
            display: none;
            role: tabpanel;
        }
        
        .tab-content.active { 
            display: block; 
        }
        
        .section { 
            background: rgba(255,255,255,0.05); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 16px; 
        }
        
        .section h3 { 
            font-size: 16px; 
            margin-bottom: 16px; 
            color: #ff6b9d; 
        }
        
        .setting-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        
        .setting-row:last-child { 
            border-bottom: none; 
        }
        
        .setting-label { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        
        .setting-label span { 
            font-size: 14px; 
        }
        
        .setting-label small { 
            font-size: 11px; 
            color: #888; 
        }
        
        select, input[type="number"], input[type="text"] { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; 
            padding: 8px 12px; 
            color: #fff; 
            font-size: 14px; 
        }
        
        select { 
            min-width: 150px; 
        }
        
        input[type="range"] { 
            width: 150px; 
        }
        
        .toggle { 
            position: relative; 
            width: 50px; 
            height: 26px; 
        }
        
        .toggle input { 
            opacity: 0; 
            width: 0; 
            height: 0; 
        }
        
        .toggle-slider { 
            position: absolute; 
            cursor: pointer; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background: rgba(255,255,255,0.1); 
            border-radius: 26px; 
            transition: 0.3s; 
        }
        
        .toggle-slider:before { 
            position: absolute; 
            content: ""; 
            height: 20px; 
            width: 20px; 
            left: 3px; 
            bottom: 3px; 
            background: #fff; 
            border-radius: 50%; 
            transition: 0.3s; 
        }
        
        .toggle input:checked + .toggle-slider { 
            background: #ff6b9d; 
        }
        
        .toggle input:checked + .toggle-slider:before { 
            transform: translateX(24px); 
        }
        
        .btn { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            transition: all 0.2s; 
        }
        
        .btn-primary { 
            background: #ff6b9d; 
            color: #fff; 
        }
        
        .btn-secondary { 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
        }
        
        .btn:hover { 
            transform: translateY(-1px); 
            opacity: 0.9; 
        }
        
        .footer { 
            display: flex; 
            justify-content: flex-end; 
            gap: 12px; 
            margin-top: 24px; 
            padding-top: 16px; 
            border-top: 1px solid rgba(255,255,255,0.1); 
        }
        
        .monitor-list { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        .monitor-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px; 
            background: rgba(0,0,0,0.2); 
            border-radius: 8px; 
        }
        
        .monitor-preview { 
            width: 60px; 
            height: 40px; 
            background: #333; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
        }
        
        .hotkey-input { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }
        
        .hotkey-input input { 
            width: 180px; 
            text-align: center; 
        }
        
        .hotkey-input .btn { 
            padding: 8px 12px; 
        }
        
        /* Screen reader only content */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <span role="img" aria-label="Settings icon">⚙️</span>
        <h1>Aria Desktop Settings</h1>
    </header>
    
    <nav class="tabs" role="tablist" aria-label="Settings categories">
        <button class="tab active" 
                data-tab="general" 
                role="tab" 
                aria-selected="true" 
                aria-controls="general"
                tabindex="0">
            General
        </button>
        <button class="tab" 
                data-tab="display" 
                role="tab" 
                aria-selected="false" 
                aria-controls="display"
                tabindex="-1">
            Display
        </button>
        <button class="tab" 
                data-tab="movement" 
                role="tab" 
                aria-selected="false" 
                aria-controls="movement"
                tabindex="-1">
            Movement
        </button>
        <button class="tab" 
                data-tab="hotkeys" 
                role="tab" 
                aria-selected="false" 
                aria-controls="hotkeys"
                tabindex="-1">
            Hotkeys
        </button>
        <button class="tab" 
                data-tab="advanced" 
                role="tab" 
                aria-selected="false" 
                aria-controls="advanced"
                tabindex="-1">
            Advanced
        </button>
    </nav>
    
    <main>
        <div id="general" class="tab-content active" role="tabpanel" aria-labelledby="general-tab"></div>
        <div id="display" class="tab-content" role="tabpanel" aria-labelledby="display-tab"></div>
        <div id="movement" class="tab-content" role="tabpanel" aria-labelledby="movement-tab"></div>
        <div id="hotkeys" class="tab-content" role="tabpanel" aria-labelledby="hotkeys-tab"></div>
        <div id="advanced" class="tab-content" role="tabpanel" aria-labelledby="advanced-tab"></div>
    </main>
    
    <footer class="footer">
        <button class="btn btn-secondary" 
                id="btn-reset"
                aria-describedby="reset-help">
            Reset to Defaults
        </button>
        <button class="btn btn-primary" 
                id="btn-save">
            Save & Close
        </button>
    </footer>
    
    <!-- Screen reader help text -->
    <div id="reset-help" class="sr-only">
        This will reset all settings to their default values
    </div>
    
    <!-- Live region for announcements -->
    <div aria-live="polite" aria-atomic="true" class="sr-only" id="announcements"></div>
    
    <script src="settings.js"></script>
</body>
</html>
