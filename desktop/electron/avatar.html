<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            -webkit-app-region: drag;
        }
        
        #avatar-container {
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-app-region: no-drag;
        }
        
        #live2d-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Status indicator */
        #status {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            -webkit-app-region: no-drag;
        }
        
        #status.visible {
            opacity: 1;
        }
        
        /* Speaking indicator */
        #speaking-indicator {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #speaking-indicator.active {
            opacity: 1;
        }
        
        .speak-dot {
            width: 8px;
            height: 8px;
            background: #ff6b9d;
            border-radius: 50%;
            animation: pulse 0.6s ease-in-out infinite;
        }
        
        .speak-dot:nth-child(2) { animation-delay: 0.2s; }
        .speak-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        
        /* Maid name badge */
        #maid-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b9d;
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            font-weight: 500;
            -webkit-app-region: no-drag;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        #maid-badge:hover {
            transform: scale(1.05);
        }
        
        /* Movement mode indicator */
        #mode-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 2px 8px;
            border-radius: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 10px;
            opacity: 0.7;
            -webkit-app-region: no-drag;
        }
        
        /* Waveform visualization */
        #waveform-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 30px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        #waveform-container.active {
            opacity: 1;
        }
        
        .waveform-bar {
            width: 4px;
            background: linear-gradient(to top, #ff6b9d, #ff8fb3);
            border-radius: 2px;
            transition: height 0.05s ease-out;
        }
        
        /* Listening ring */
        #listening-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            border: 3px solid transparent;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #listening-ring.active {
            opacity: 1;
            border-color: rgba(255, 107, 157, 0.5);
            animation: listening-pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes listening-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.7; }
        }
        
        /* Notification reaction indicator */
        #notification-indicator {
            position: absolute;
            top: 40px;
            right: 10px;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        
        #notification-indicator.active {
            opacity: 1;
            animation: notification-bounce 0.5s ease-out;
        }
        
        /* Accessibility improvements */
        :focus {
            outline: 2px solid #ff6b9d;
            outline-offset: 2px;
        }
        
        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --bg-color: #000000;
                --text-color: #ffffff;
                --accent-color: #ffff00;
                --border-color: #ffffff;
            }
            
            #status, #mode-indicator {
                background: var(--bg-color);
                color: var(--text-color);
                border: 1px solid var(--border-color);
            }
            
            #maid-badge {
                background: var(--accent-color);
                color: var(--bg-color);
                border: 2px solid var(--border-color);
            }
        }
        
        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Screen reader only content */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        /* Skip link for keyboard navigation */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 6px;
            background: #ff6b9d;
            color: white;
            padding: 8px;
            text-decoration: none;
            border-radius: 4px;
            z-index: 1000;
            transition: top 0.3s;
        }
        
        .skip-link:focus {
            top: 6px;
        }
    </style>
</head>
<body>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div id="avatar-container" role="main" aria-label="Aria Desktop Avatar">
        <main id="main-content">
            <canvas id="live2d-canvas" aria-label="Live2D Avatar Display"></canvas>
            <div id="listening-ring" aria-hidden="true"></div>
            
            <button id="maid-badge" 
                    aria-label="Current maid: Aria. Press Enter or Space to switch maids"
                    tabindex="0"
                    role="button">
                Aria
            </button>
            
            <div id="speaking-indicator" 
                 aria-live="polite" 
                 aria-label="Speaking indicator"
                 role="status">
                <div class="speak-dot" aria-hidden="true"></div>
                <div class="speak-dot" aria-hidden="true"></div>
                <div class="speak-dot" aria-hidden="true"></div>
                <span class="sr-only" id="speaking-status">Not speaking</span>
            </div>
            
            <div id="waveform-container" 
                 aria-live="polite" 
                 aria-label="Audio waveform visualization"
                 role="img">
                <span class="sr-only">Audio waveform display</span>
            </div>
            
            <div id="notification-indicator" 
                 aria-live="assertive" 
                 aria-label="Notification indicator"
                 role="status">
                🔔
                <span class="sr-only" id="notification-status">No notifications</span>
            </div>
            
            <div id="status" 
                 aria-live="polite" 
                 role="status"
                 aria-label="Avatar status">
                Connecting...
            </div>
            
            <div id="mode-indicator" 
                 aria-live="polite" 
                 aria-label="Current movement mode"
                 role="status">
                idle
            </div>
        </main>
        
        <!-- Keyboard shortcuts help -->
        <div id="keyboard-help" class="sr-only" role="region" aria-label="Keyboard shortcuts">
            <h2>Keyboard Shortcuts</h2>
            <ul>
                <li>Tab: Navigate between elements</li>
                <li>Enter/Space: Activate buttons</li>
                <li>Escape: Close dialogs</li>
                <li>Ctrl+Shift+A: Toggle visibility</li>
                <li>Ctrl+Shift+M: Switch maids</li>
            </ul>
        </div>
    </div>

    <!-- PIXI.js and Live2D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
    
    <!-- MediaPipe Face Mesh (loaded conditionally) -->
    <script>
        // MediaPipe will be loaded dynamically if enabled
        let mediaPipeLoaded = false;
        let faceMesh = null;
        
        async function loadMediaPipe() {
            if (mediaPipeLoaded) return true;
            
            try {
                // Load MediaPipe scripts dynamically
                await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js');
                await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js');
                mediaPipeLoaded = true;
                console.log('✅ MediaPipe loaded');
                return true;
            } catch (e) {
                console.error('Failed to load MediaPipe:', e);
                return false;
            }
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
    </script>

    <script>
        // Configuration
        const WS_URL = 'ws://localhost:8765';
        const RECONNECT_DELAY = 3000;
        
        const MODEL_BASE_URL = 'http://localhost:8080';
        const MAIDS = {
            aria: {
                name: "Aria",
                modelPath: `${MODEL_BASE_URL}/live2d/models/aria/长离.model3.json`,
                hasModel: true,
                color: "#ff6b9d"
            },
            sophia: { name: "Sophia", modelPath: null, hasModel: false, color: "#9b59b6" },
            luna: {
                name: "Luna",
                modelPath: `${MODEL_BASE_URL}/live2d/models/luna/Nicole.model3.json`,
                hasModel: true,
                color: "#3498db"
            },
            rose: { name: "Rose", modelPath: null, hasModel: false, color: "#e74c3c" },
            mei: { name: "Mei", modelPath: null, hasModel: false, color: "#2ecc71" },
            clara: { name: "Clara", modelPath: null, hasModel: false, color: "#f39c12" }
        };

        // State
        let ws = null;
        let pixiApp = null;
        let live2dModel = null;
        let currentMaid = 'aria';
        let reconnectTimer = null;
        let settings = null;
        
        // Movement state
        let movementMode = 'idle';
        let mouseTrackingInterval = null;
        let idleAnimationFrame = null;
        let currentZoom = 1.0;
        
        // Tracking state
        let targetAngleX = 0;
        let targetAngleY = 0;
        let currentAngleX = 0;
        let currentAngleY = 0;
        
        // Idle animation state
        let idleTime = 0;
        let breathTime = 0;
        let blinkTimer = 0;
        let nextBlinkTime = 2000 + Math.random() * 4000;
        
        // Waveform state
        let audioContext = null;
        let analyser = null;
        let waveformBars = [];
        let waveformAnimationFrame = null;
        
        // MediaPipe state
        let useMediaPipe = false;
        let mediaPipeCamera = null;

        // DOM
        const canvas = document.getElementById('live2d-canvas');
        const status = document.getElementById('status');
        const maidBadge = document.getElementById('maid-badge');
        const speakingIndicator = document.getElementById('speaking-indicator');
        const modeIndicator = document.getElementById('mode-indicator');
        const waveformContainer = document.getElementById('waveform-container');
        const listeningRing = document.getElementById('listening-ring');
        const notificationIndicator = document.getElementById('notification-indicator');
        
        // Initialize waveform bars
        function initWaveformBars() {
            waveformContainer.innerHTML = '';
            waveformBars = [];
            for (let i = 0; i < 12; i++) {
                const bar = document.createElement('div');
                bar.className = 'waveform-bar';
                bar.style.height = '4px';
                waveformContainer.appendChild(bar);
                waveformBars.push(bar);
            }
        }
        initWaveformBars();

        // ============ Electron API Integration ============
        
        if (window.electronAPI) {
            // Settings loaded from main process
            window.electronAPI.onSettingsLoaded((loadedSettings) => {
                console.log('📥 Settings loaded:', loadedSettings);
                settings = loadedSettings;
                movementMode = settings.avatar?.movementMode || 'idle';
                currentMaid = settings.avatar?.currentMaid || 'aria';
                useMediaPipe = settings.avatar?.useMediaPipe || false;
                
                console.log(`🎭 Current maid: ${currentMaid}, Movement: ${movementMode}, Scale: ${settings.avatar?.modelScale}`);
                
                modeIndicator.textContent = movementMode;
                updateMovementMode();
                
                if (live2dModel) {
                    console.log('🔄 Applying settings to existing model...');
                    resizeModel();
                }
            });
            
            // Settings updated from main process (real-time changes)
            window.electronAPI.onSettingsUpdated((updatedSettings) => {
                console.log('📥 Settings updated:', updatedSettings);
                settings = updatedSettings;
                
                if (live2dModel) {
                    console.log('🔄 Applying updated settings to model...');
                    resizeModel();
                }
            });
            
            // Notification reaction from main process
            window.electronAPI.onNotificationReaction((data) => {
                triggerNotificationReaction(data.type);
            });
            
            // Maid switch from tray
            window.electronAPI.onSwitchMaid((maidId) => {
                console.log(`🎀 Switching to ${maidId}`);
                loadMaidModel(maidId);
            });
            
            // Legacy zoom handler - redirect to model scale
            window.electronAPI.onSetZoom((zoom) => {
                console.warn('⚠️ Legacy zoom handler called, redirecting to model scale');
                if (settings?.avatar) {
                    settings.avatar.modelScale = zoom;
                }
                resizeModel();
                showStatus(`Size: ${Math.round(zoom * 100)}%`);
            });
            
            // Movement mode change from tray
            window.electronAPI.onSetMovementMode((mode) => {
                movementMode = mode;
                modeIndicator.textContent = mode;
                updateMovementMode();
                showStatus(`Mode: ${mode}`);
            });
            
            // Expression trigger from tray
            window.electronAPI.onTriggerExpression((expression) => {
                console.log(`Expression: ${expression}`);
                if (expression === 'default') {
                    resetModelPose();
                    setModelParameter('ParamMouthForm', 0);
                    setModelParameter('ParamEyeLOpen', 1);
                    setModelParameter('ParamEyeROpen', 1);
                } else {
                    setExpression(expression);
                }
                showStatus(`Expression: ${expression}`, 1500);
            });
            
            // Action trigger from tray
            window.electronAPI.onTriggerAction((action) => {
                console.log(`Action: ${action}`);
                switch (action) {
                    case 'wave':
                        triggerGreeting();
                        break;
                    case 'blink':
                        triggerBlink();
                        break;
                }
            });
            
            // Display control events
            window.electronAPI.onSetModelScale((scale) => {
                console.log(`📏 Received model scale from main process: ${scale}`);
                settings.avatar.modelScale = scale;
                resizeModel();
                showStatus(`Size: ${Math.round(scale * 100)}%`);
            });
            
            window.electronAPI.onSetFocusMode((mode) => {
                settings.avatar.focusMode = mode;
                resizeModel();
                showStatus(`Focus: ${mode}`);
            });
            
            window.electronAPI.onSetModelOffset((offset) => {
                settings.avatar.modelOffsetY = offset;
                resizeModel();
            });
            
            window.electronAPI.onWindowResized(() => {
                if (pixiApp) {
                    pixiApp.renderer.resize(window.innerWidth, window.innerHeight);
                    resizeModel();
                }
            });
        }

        // ============ Movement Modes ============
        
        function updateMovementMode() {
            // Stop existing tracking
            if (mouseTrackingInterval) {
                clearInterval(mouseTrackingInterval);
                mouseTrackingInterval = null;
            }
            if (idleAnimationFrame) {
                cancelAnimationFrame(idleAnimationFrame);
                idleAnimationFrame = null;
            }
            stopCameraTracking();
            
            // Reset angles
            targetAngleX = 0;
            targetAngleY = 0;
            
            switch (movementMode) {
                case 'static':
                    // No movement, reset to center
                    resetModelPose();
                    break;
                    
                case 'idle':
                    startIdleAnimation();
                    break;
                    
                case 'mouse':
                    startMouseTracking();
                    break;
                    
                case 'camera':
                    startCameraTracking();
                    break;
                    
                case 'wander':
                    startRandomWander();
                    break;
                    
                case 'follow':
                    // Follow active window - handled by main process
                    // Avatar uses idle animation while following
                    startIdleAnimation();
                    if (window.electronAPI) {
                        window.electronAPI.notifyMovementModeChanged('follow');
                    }
                    break;
            }
        }
        
        function resetModelPose() {
            if (!live2dModel) return;
            setModelParameter('ParamAngleX', 0);
            setModelParameter('ParamAngleY', 0);
            setModelParameter('ParamAngleZ', 0);
            setModelParameter('ParamEyeBallX', 0);
            setModelParameter('ParamEyeBallY', 0);
            setModelParameter('ParamBodyAngleX', 0);
        }
        
        // ============ Idle Animation ============
        
        function startIdleAnimation() {
            let lastTime = performance.now();
            
            function animate(currentTime) {
                if (movementMode !== 'idle') return;
                
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;
                
                idleTime += deltaTime;
                breathTime += deltaTime;
                blinkTimer += deltaTime;
                
                if (!live2dModel) {
                    idleAnimationFrame = requestAnimationFrame(animate);
                    return;
                }
                
                // Breathing (subtle body movement)
                const breathValue = Math.sin(breathTime / 3000) * 0.02;
                setModelParameter('ParamBreath', 0.5 + breathValue);
                
                // Subtle head sway
                const swayX = Math.sin(idleTime / 5000) * 3;
                const swayY = Math.sin(idleTime / 4000) * 2;
                setModelParameter('ParamAngleX', swayX);
                setModelParameter('ParamAngleY', swayY);
                
                // Random looking around
                const lookX = Math.sin(idleTime / 7000) * 0.3;
                const lookY = Math.sin(idleTime / 6000) * 0.2;
                setModelParameter('ParamEyeBallX', lookX);
                setModelParameter('ParamEyeBallY', lookY);
                
                // Blinking
                if (blinkTimer > nextBlinkTime) {
                    triggerBlink();
                    blinkTimer = 0;
                    nextBlinkTime = 2000 + Math.random() * 4000;
                }
                
                idleAnimationFrame = requestAnimationFrame(animate);
            }
            
            idleAnimationFrame = requestAnimationFrame(animate);
        }
        
        function triggerBlink() {
            if (!live2dModel) return;
            
            // Quick blink animation
            const blinkDuration = 150;
            const startTime = performance.now();
            
            function blinkFrame(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = elapsed / blinkDuration;
                
                if (progress >= 1) {
                    setModelParameter('ParamEyeLOpen', 1);
                    setModelParameter('ParamEyeROpen', 1);
                    return;
                }
                
                // Close then open
                const eyeOpen = progress < 0.5 
                    ? 1 - (progress * 2)  // Closing
                    : (progress - 0.5) * 2; // Opening
                
                setModelParameter('ParamEyeLOpen', eyeOpen);
                setModelParameter('ParamEyeROpen', eyeOpen);
                
                requestAnimationFrame(blinkFrame);
            }
            
            requestAnimationFrame(blinkFrame);
        }
        
        // ============ Mouse Tracking ============
        
        async function startMouseTracking() {
            if (!window.electronAPI) {
                console.warn('Mouse tracking requires Electron');
                return;
            }
            
            const screenSize = await window.electronAPI.getScreenSize();
            const windowBounds = await window.electronAPI.getWindowBounds();
            
            // Smooth interpolation
            function lerp(current, target, factor) {
                return current + (target - current) * factor;
            }
            
            mouseTrackingInterval = setInterval(async () => {
                if (movementMode !== 'mouse' || !live2dModel) return;
                
                try {
                    const cursor = await window.electronAPI.getCursorPosition();
                    const bounds = await window.electronAPI.getWindowBounds();
                    
                    // Calculate avatar center
                    const avatarCenterX = bounds.x + bounds.width / 2;
                    const avatarCenterY = bounds.y + bounds.height / 2;
                    
                    // Calculate angle from avatar to cursor
                    const deltaX = cursor.x - avatarCenterX;
                    const deltaY = cursor.y - avatarCenterY;
                    
                    // Normalize to -1 to 1 range based on screen size
                    const normalizedX = Math.max(-1, Math.min(1, deltaX / (screenSize.width / 2)));
                    const normalizedY = Math.max(-1, Math.min(1, deltaY / (screenSize.height / 2)));
                    
                    // Map to Live2D parameters
                    targetAngleX = normalizedX * 30; // Head rotation
                    targetAngleY = normalizedY * 20;
                    
                    // Smooth interpolation
                    currentAngleX = lerp(currentAngleX, targetAngleX, 0.1);
                    currentAngleY = lerp(currentAngleY, targetAngleY, 0.1);
                    
                    setModelParameter('ParamAngleX', currentAngleX);
                    setModelParameter('ParamAngleY', currentAngleY);
                    setModelParameter('ParamEyeBallX', normalizedX * 0.8);
                    setModelParameter('ParamEyeBallY', normalizedY * 0.5);
                    setModelParameter('ParamBodyAngleX', currentAngleX * 0.3);
                    
                } catch (e) {
                    console.error('Mouse tracking error:', e);
                }
            }, 16); // ~60fps
        }
        
        // ============ Camera Tracking ============
        
        let cameraStream = null;
        let cameraVideo = null;
        let cameraCanvas = null;
        let cameraCtx = null;
        let faceDetectionInterval = null;
        
        async function startCameraTracking() {
            showStatus('Starting camera...', 3000);
            
            // Check if MediaPipe should be used
            if (useMediaPipe) {
                const loaded = await loadMediaPipe();
                if (loaded) {
                    await startMediaPipeCameraTracking();
                    return;
                }
                // Fall back to basic tracking if MediaPipe fails
                showStatus('MediaPipe unavailable, using basic tracking', 2000);
            }
            
            try {
                // Request camera permission
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 320 },
                        height: { ideal: 240 },
                        facingMode: 'user'
                    } 
                });
                
                // Create hidden video element
                if (!cameraVideo) {
                    cameraVideo = document.createElement('video');
                    cameraVideo.style.display = 'none';
                    cameraVideo.autoplay = true;
                    cameraVideo.playsInline = true;
                    document.body.appendChild(cameraVideo);
                    
                    cameraCanvas = document.createElement('canvas');
                    cameraCanvas.width = 320;
                    cameraCanvas.height = 240;
                    cameraCtx = cameraCanvas.getContext('2d');
                }
                
                cameraVideo.srcObject = cameraStream;
                await cameraVideo.play();
                
                showStatus('Camera active', 2000);
                modeIndicator.textContent = 'camera 📷';
                
                // Start face detection loop
                startFaceDetection();
                
            } catch (error) {
                console.error('Camera access failed:', error);
                showStatus('Camera unavailable - using idle', 3000);
                
                // Fall back to idle
                movementMode = 'idle';
                modeIndicator.textContent = 'idle (no camera)';
                startIdleAnimation();
            }
        }
        
        // ============ MediaPipe Camera Tracking ============
        
        async function startMediaPipeCameraTracking() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: 'user' } 
                });
                
                if (!cameraVideo) {
                    cameraVideo = document.createElement('video');
                    cameraVideo.style.display = 'none';
                    cameraVideo.autoplay = true;
                    cameraVideo.playsInline = true;
                    document.body.appendChild(cameraVideo);
                }
                
                cameraVideo.srcObject = cameraStream;
                await cameraVideo.play();
                
                // Initialize MediaPipe FaceMesh
                faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });
                
                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                faceMesh.onResults(onMediaPipeResults);
                
                // Start camera processing
                mediaPipeCamera = new Camera(cameraVideo, {
                    onFrame: async () => {
                        if (movementMode === 'camera' && faceMesh) {
                            await faceMesh.send({ image: cameraVideo });
                        }
                    },
                    width: 640,
                    height: 480
                });
                
                await mediaPipeCamera.start();
                
                showStatus('MediaPipe camera active', 2000);
                modeIndicator.textContent = 'camera 📷 (MP)';
                
            } catch (error) {
                console.error('MediaPipe camera failed:', error);
                showStatus('MediaPipe failed - using basic tracking', 2000);
                useMediaPipe = false;
                startCameraTracking(); // Retry with basic tracking
            }
        }
        
        function onMediaPipeResults(results) {
            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
            
            const landmarks = results.multiFaceLandmarks[0];
            
            // Get nose tip (landmark 1) for head position
            const noseTip = landmarks[1];
            
            // Get eye landmarks for gaze
            const leftEye = landmarks[468]; // Left eye center
            const rightEye = landmarks[473]; // Right eye center
            
            // Calculate head rotation from nose position (0.5 is center)
            const headX = (0.5 - noseTip.x) * 60; // -30 to 30 degrees
            const headY = (noseTip.y - 0.5) * 40; // -20 to 20 degrees
            
            // Calculate head tilt from eye positions
            const eyeDeltaY = rightEye.y - leftEye.y;
            const headZ = eyeDeltaY * 30; // Head tilt
            
            // Smooth interpolation
            targetAngleX = headX;
            targetAngleY = headY;
            
            currentAngleX = currentAngleX * 0.7 + targetAngleX * 0.3;
            currentAngleY = currentAngleY * 0.7 + targetAngleY * 0.3;
            
            if (live2dModel) {
                setModelParameter('ParamAngleX', currentAngleX);
                setModelParameter('ParamAngleY', currentAngleY);
                setModelParameter('ParamAngleZ', headZ);
                setModelParameter('ParamEyeBallX', (0.5 - noseTip.x) * 1.5);
                setModelParameter('ParamEyeBallY', (noseTip.y - 0.5) * 1.0);
                setModelParameter('ParamBodyAngleX', currentAngleX * 0.3);
                
                // Mouth tracking from landmarks
                const upperLip = landmarks[13];
                const lowerLip = landmarks[14];
                const mouthOpen = Math.abs(upperLip.y - lowerLip.y) * 3;
                setModelParameter('ParamMouthOpenY', Math.min(1, mouthOpen));
            }
        }

            }
        }
        
        function startFaceDetection() {
            // Simple brightness-based face detection
            // For better results, integrate face-api.js or MediaPipe
            
            let lastFaceX = 0.5;
            let lastFaceY = 0.5;
            
            faceDetectionInterval = setInterval(() => {
                if (movementMode !== 'camera' || !cameraVideo || !cameraCtx) return;
                
                try {
                    // Draw video frame to canvas
                    cameraCtx.drawImage(cameraVideo, 0, 0, 320, 240);
                    const imageData = cameraCtx.getImageData(0, 0, 320, 240);
                    const data = imageData.data;
                    
                    // Simple center-of-brightness detection (approximates face position)
                    let totalBrightness = 0;
                    let weightedX = 0;
                    let weightedY = 0;
                    
                    for (let y = 0; y < 240; y++) {
                        for (let x = 0; x < 320; x++) {
                            const i = (y * 320 + x) * 4;
                            // Skin tone detection (rough approximation)
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];
                            
                            // Check for skin-like colors
                            if (r > 95 && g > 40 && b > 20 &&
                                r > g && r > b &&
                                Math.abs(r - g) > 15 &&
                                r - g > 15) {
                                const brightness = (r + g + b) / 3;
                                totalBrightness += brightness;
                                weightedX += x * brightness;
                                weightedY += y * brightness;
                            }
                        }
                    }
                    
                    if (totalBrightness > 1000) {
                        // Normalize to 0-1 range
                        const faceX = weightedX / totalBrightness / 320;
                        const faceY = weightedY / totalBrightness / 240;
                        
                        // Smooth with previous values
                        lastFaceX = lastFaceX * 0.7 + faceX * 0.3;
                        lastFaceY = lastFaceY * 0.7 + faceY * 0.3;
                        
                        // Map to avatar parameters (inverted X for mirror effect)
                        const normalizedX = (0.5 - lastFaceX) * 2; // -1 to 1
                        const normalizedY = (lastFaceY - 0.5) * 2; // -1 to 1
                        
                        // Smooth interpolation
                        targetAngleX = normalizedX * 25;
                        targetAngleY = normalizedY * 15;
                        
                        currentAngleX = currentAngleX * 0.85 + targetAngleX * 0.15;
                        currentAngleY = currentAngleY * 0.85 + targetAngleY * 0.15;
                        
                        if (live2dModel) {
                            setModelParameter('ParamAngleX', currentAngleX);
                            setModelParameter('ParamAngleY', currentAngleY);
                            setModelParameter('ParamEyeBallX', normalizedX * 0.6);
                            setModelParameter('ParamEyeBallY', normalizedY * 0.4);
                            setModelParameter('ParamBodyAngleX', currentAngleX * 0.2);
                        }
                    }
                    
                } catch (e) {
                    console.error('Face detection error:', e);
                }
            }, 50); // 20fps for face detection
        }

        // ============ Random Wander Mode ============
        
        let wanderAnimationFrame = null;
        let wanderTargetX = 0;
        let wanderTargetY = 0;
        let wanderChangeTime = 0;
        
        function startRandomWander() {
            let lastTime = performance.now();
            wanderChangeTime = 0;
            
            function animate(currentTime) {
                if (movementMode !== 'wander') return;
                
                const deltaTime = currentTime - lastTime;
                lastTime = currentTime;
                wanderChangeTime += deltaTime;
                
                if (!live2dModel) {
                    wanderAnimationFrame = requestAnimationFrame(animate);
                    return;
                }
                
                // Change target every 2-5 seconds
                if (wanderChangeTime > 2000 + Math.random() * 3000) {
                    wanderTargetX = (Math.random() - 0.5) * 40; // -20 to 20
                    wanderTargetY = (Math.random() - 0.5) * 20; // -10 to 10
                    wanderChangeTime = 0;
                }
                
                // Smooth interpolation to target
                currentAngleX = currentAngleX * 0.98 + wanderTargetX * 0.02;
                currentAngleY = currentAngleY * 0.98 + wanderTargetY * 0.02;
                
                setModelParameter('ParamAngleX', currentAngleX);
                setModelParameter('ParamAngleY', currentAngleY);
                setModelParameter('ParamEyeBallX', currentAngleX / 40);
                setModelParameter('ParamEyeBallY', currentAngleY / 20);
                
                // Add breathing
                breathTime += deltaTime;
                const breathValue = Math.sin(breathTime / 3000) * 0.02;
                setModelParameter('ParamBreath', 0.5 + breathValue);
                
                // Blinking
                blinkTimer += deltaTime;
                if (blinkTimer > nextBlinkTime) {
                    triggerBlink();
                    blinkTimer = 0;
                    nextBlinkTime = 2000 + Math.random() * 4000;
                }
                
                wanderAnimationFrame = requestAnimationFrame(animate);
            }
            
            wanderAnimationFrame = requestAnimationFrame(animate);
        }

        function triggerGreeting() {
            if (!live2dModel) return;
            
            showStatus('👋', 1000);
            
            // Wave animation - tilt head and smile
            const startTime = performance.now();
            const duration = 800;
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease in-out
                const ease = progress < 0.5 
                    ? 2 * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                
                // Head tilt
                const tilt = Math.sin(progress * Math.PI * 2) * 10;
                setModelParameter('ParamAngleZ', tilt);
                
                // Smile
                setModelParameter('ParamMouthForm', ease * 0.8);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Reset
                    setModelParameter('ParamAngleZ', 0);
                    setTimeout(() => setModelParameter('ParamMouthForm', 0), 500);
                }
            }
            
            requestAnimationFrame(animate);
        }

        // ============ Modifier-Key Controls ============
        // Hold Ctrl + drag to move window anywhere
        // Hold Ctrl + scroll to fine-tune character scale
        
        let modifierDragState = {
            isDragging: false,
            startX: 0,
            startY: 0,
            windowStartX: 0,
            windowStartY: 0
        };
        
        function setupModifierControls() {
            const container = document.getElementById('avatar-container');
            
            // Check if modifier controls are enabled in settings
            function isModifierControlEnabled() {
                return settings?.controls?.modifierDragEnabled !== false; // Default enabled
            }
            
            // Ctrl + mousedown to start drag
            container.addEventListener('mousedown', async (e) => {
                if (!e.ctrlKey || !isModifierControlEnabled()) return;
                if (!window.electronAPI) return;
                
                e.preventDefault();
                e.stopPropagation();
                
                const bounds = await window.electronAPI.getWindowBounds();
                modifierDragState = {
                    isDragging: true,
                    startX: e.screenX,
                    startY: e.screenY,
                    windowStartX: bounds.x,
                    windowStartY: bounds.y
                };
                
                // Change cursor to indicate dragging
                document.body.style.cursor = 'move';
                showStatus('🖱️ Drag to move', 1000);
            });
            
            // Mouse move while dragging
            document.addEventListener('mousemove', async (e) => {
                if (!modifierDragState.isDragging) return;
                if (!window.electronAPI) return;
                
                const deltaX = e.screenX - modifierDragState.startX;
                const deltaY = e.screenY - modifierDragState.startY;
                
                const newX = modifierDragState.windowStartX + deltaX;
                const newY = modifierDragState.windowStartY + deltaY;
                
                // Move window via IPC
                await window.electronAPI.moveWindow(newX, newY);
            });
            
            // Mouse up to stop drag
            document.addEventListener('mouseup', () => {
                if (modifierDragState.isDragging) {
                    modifierDragState.isDragging = false;
                    document.body.style.cursor = '';
                }
            });
            
            // Ctrl + scroll to adjust character scale
            container.addEventListener('wheel', async (e) => {
                if (!e.ctrlKey || !isModifierControlEnabled()) return;
                if (!window.electronAPI) return;
                
                e.preventDefault();
                e.stopPropagation();
                
                // Get current scale
                const currentScale = settings?.avatar?.modelScale ?? 1.0;
                
                // Calculate new scale (scroll up = bigger, scroll down = smaller)
                // Use smaller increments for smoother control (0.5% instead of 2%)
                const delta = e.deltaY > 0 ? -0.005 : 0.005;
                const newScale = Math.max(0.3, Math.min(3.0, currentScale + delta));
                
                console.log(`🖱️ Mouse wheel scale: ${currentScale.toFixed(3)} → ${newScale.toFixed(3)}`);
                
                // Update settings and apply
                if (settings?.avatar) {
                    settings.avatar.modelScale = newScale;
                }
                
                // Send to main process to persist
                await window.electronAPI.setModelScaleFromRenderer(newScale);
                
                // Apply immediately
                resizeModel();
                showStatus(`Size: ${Math.round(newScale * 100)}%`, 800);
            }, { passive: false });
            
            // Release Ctrl while dragging cancels the drag
            document.addEventListener('keyup', (e) => {
                if (e.key === 'Control' && modifierDragState.isDragging) {
                    modifierDragState.isDragging = false;
                    document.body.style.cursor = '';
                }
            });
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'init':
                    if (data.current_maid && data.current_maid !== currentMaid) {
                        setCurrentMaid(data.current_maid);
                        loadMaidModel(data.current_maid);
                    }
                    break;
                    
                case 'transcript':
                    if (!data.is_user) {
                        animateSpeaking(data.text.length);
                    }
                    break;
                    
                case 'handoff':
                    console.log(`🎭 Handoff: ${data.from_maid} → ${data.to_maid}`);
                    setCurrentMaid(data.to_maid);
                    loadMaidModel(data.to_maid);
                    break;
                    
                case 'live2d_param':
                    setModelParameter(data.param, data.value);
                    break;
                    
                case 'expression':
                    setExpression(data.expression);
                    break;
                    
                case 'listening':
                    setListeningState(data.active);
                    break;
                    
                case 'speaking':
                    if (data.active) {
                        speakingIndicator.classList.add('active');
                        waveformContainer.classList.add('active');
                    } else {
                        speakingIndicator.classList.remove('active');
                        waveformContainer.classList.remove('active');
                    }
                    break;
                    
                case 'audio_level':
                    // Real-time audio level from backend
                    updateWaveformFromLevel(data.level);
                    break;
            }
        }
        
        function updateWaveformFromLevel(level) {
            // level is 0-1
            waveformBars.forEach((bar, i) => {
                const variation = Math.sin(Date.now() / 100 + i) * 0.3;
                const height = 4 + (level + variation) * 26;
                bar.style.height = `${Math.max(4, height)}px`;
            });
        }

        async function loadMaidModel(maidId) {
            const maid = MAIDS[maidId];
            
            if (!maid || !maid.hasModel || !maid.modelPath) {
                console.log(`No model for ${maidId}`);
                showStatus(`No avatar for ${maid?.name || maidId}`);
                return;

            setCurrentMaid(maidId);

            try {
                // Remove existing model
                if (live2dModel) {
                    pixiApp.stage.removeChild(live2dModel);
                    live2dModel.destroy();
                    live2dModel = null;
                }
                
                console.log(`🔄 Loading model from: ${maid.modelPath}`);
                
                // Load new model with error handling
                live2dModel = await PIXI.live2d.Live2DModel.from(maid.modelPath, {
                    autoInteract: false, // We handle interaction
                    autoUpdate: true
                });
                
                if (!live2dModel) {
                    throw new Error('Model loaded but is null/undefined');
                }
                
                console.log(`✅ Model loaded successfully - Dimensions: ${live2dModel.width}x${live2dModel.height}`);
                
                // Configure model IMMEDIATELY after loading

                live2dModel.interactive = true;
                
                // Add to stage FIRST
                pixiApp.stage.addChild(live2dModel);
                
                // Wait for the model to be fully added to the stage
                await new Promise(resolve => requestAnimationFrame(resolve));
                
                // Enable interaction
                live2dModel.on('hit', (hitAreas) => {
                    console.log('Hit:', hitAreas);
                    triggerBlink();
                });
                
                // Apply initial positioning with multiple attempts to ensure it sticks

                    console.log('🔧 Applying final positioning (attempt 3)...');

                console.log(`✅ Loaded ${maid.name} - Model size: ${live2dModel.width}x${live2dModel.height}`);

        function resizeModel() {
            if (!live2dModel || !pixiApp) {
                console.log('❌ ResizeModel called but model or app not ready');
                return;
            }
            
            // Get display settings with proper fallbacks
            const modelScale = settings?.avatar?.modelScale ?? 1.0;
            const modelOffsetY = settings?.avatar?.modelOffsetY ?? 0; // -1 to 1, negative = up
            const focusMode = settings?.avatar?.focusMode ?? 'upper'; // full, upper, face
            
            console.log('🔧 ResizeModel Debug Info:');
            console.log(`  - Settings object:`, settings);
            console.log(`  - Model Scale: ${modelScale}`);
            console.log(`  - Focus Mode: ${focusMode}`);
            console.log(`  - Model Offset Y: ${modelOffsetY}`);
            console.log(`  - Model dimensions: ${live2dModel.width}x${live2dModel.height}`);
            console.log(`  - Screen dimensions: ${pixiApp.screen.width}x${pixiApp.screen.height}`);
            console.log(`  - Current model position BEFORE: (${live2dModel.x}, ${live2dModel.y})`);
            console.log(`  - Current model scale BEFORE: (${live2dModel.scale.x}, ${live2dModel.scale.y})`);
            
            // Set anchor FIRST before any positioning calculations
            live2dModel.anchor.set(0.5, 0.5);
            console.log('✅ Anchor set to (0.5, 0.5)');
            
            // Calculate base scale based on focus mode
            let baseScale;
            switch (focusMode) {
                case 'face':
                    // For face mode, scale larger to focus on face
                    baseScale = Math.min(
                        pixiApp.screen.width / live2dModel.width * 1.2,
                        pixiApp.screen.height / live2dModel.height * 1.2
                    );
                    break;
                case 'upper':
                    // For upper body, use moderate scaling
                    baseScale = Math.min(
                        pixiApp.screen.width / live2dModel.width * 0.95,
                        pixiApp.screen.height / live2dModel.height * 1.0
                    );
                    break;
                case 'full':
                default:
                    // For full body, use conservative scaling
                    baseScale = Math.min(
                        pixiApp.screen.width / live2dModel.width * 0.9,
                        pixiApp.screen.height / live2dModel.height * 0.95
                    );
                    break;
            }
            
            // Apply user's model scale multiplier
            const finalScale = baseScale * modelScale;
            
            console.log(`📏 Scale calculation: baseScale=${baseScale.toFixed(3)}, modelScale=${modelScale.toFixed(2)}, finalScale=${finalScale.toFixed(3)}`);
            
            // Apply the scale
            live2dModel.scale.set(finalScale);
            console.log(`✅ Scale applied: (${live2dModel.scale.x}, ${live2dModel.scale.y})`);
            
            // Center horizontally (anchor is 0.5, so this centers it)
            live2dModel.x = pixiApp.screen.width / 2;
            console.log(`✅ X position set to center: ${live2dModel.x}`);
            
            // Calculate Y position based on focus mode
            let yPosition;
            switch (focusMode) {
                case 'face':
                    // Show face - position higher (less Y offset)
                    yPosition = pixiApp.screen.height * 0.6;
                    break;
                case 'upper':
                    // Show upper body - moderate position
                    yPosition = pixiApp.screen.height * 0.65;
                    break;
                case 'full':
                default:
                    // Show full body - position lower to show more of body
                    yPosition = pixiApp.screen.height * 0.7;
                    break;
            }
            
            console.log(`📍 Base Y position for ${focusMode} mode: ${yPosition}`);
            
            // Apply manual offset adjustment (convert -1 to 1 range to pixel offset)
            const offsetPixels = modelOffsetY * (pixiApp.screen.height * 0.2);
            yPosition += offsetPixels;
            
            console.log(`📍 Y offset applied: ${offsetPixels}, final Y: ${yPosition}`);
            
            live2dModel.y = yPosition;
            
            console.log(`✅ Final position set: (${live2dModel.x.toFixed(1)}, ${live2dModel.y.toFixed(1)})`);
            console.log(`🎯 Model bounds after scaling: ${(live2dModel.width * finalScale).toFixed(1)}x${(live2dModel.height * finalScale).toFixed(1)}`);
            
            // Force multiple render updates to ensure positioning sticks
            if (pixiApp.renderer) {
                pixiApp.renderer.render(pixiApp.stage);
                console.log('🔄 Forced render update');
                
                // Force another render on next frame
                requestAnimationFrame(() => {
                    pixiApp.renderer.render(pixiApp.stage);
                    console.log('🔄 Forced second render update');
                });
            }
        }
            }
        }

        function setModelParameter(paramId, value) {
            if (!live2dModel?.internalModel?.coreModel) return;
            try {
                const coreModel = live2dModel.internalModel.coreModel;
                const index = coreModel.getParameterIndex(paramId);
                if (index >= 0) {
                    coreModel.setParameterValueByIndex(index, value);
                } else {
                    console.warn(`⚠️ Parameter '${paramId}' not found in model`);
                }
            } catch (e) {
                console.error(`❌ Error setting parameter '${paramId}':`, e);
            }
        }

        function setExpression(name) {
            if (!live2dModel) return;
            try {
                live2dModel.expression(name);
            } catch (e) {}
        }

        function animateSpeaking(textLength) {
            if (!live2dModel) return;
            
            speakingIndicator.classList.add('active');
            waveformContainer.classList.add('active');
            
            const duration = Math.min(textLength * 50, 3000);
            const startTime = Date.now();
            
            function animate() {
                const elapsed = Date.now() - startTime;
                if (elapsed > duration) {
                    setModelParameter('ParamMouthOpenY', 0);
                    speakingIndicator.classList.remove('active');
                    waveformContainer.classList.remove('active');
                    // Reset waveform bars
                    waveformBars.forEach(bar => bar.style.height = '4px');
                    return;
                }
                
                const value = Math.sin(elapsed / 100) * 0.5 + 0.3;
                setModelParameter('ParamMouthOpenY', Math.max(0, value));
                
                // Animate waveform bars
                waveformBars.forEach((bar, i) => {
                    const phase = (elapsed / 80) + (i * 0.5);
                    const height = 4 + Math.abs(Math.sin(phase)) * 20 + Math.random() * 6;
                    bar.style.height = `${height}px`;
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }
        
        // ============ Waveform Visualization (Audio Input) ============
        
        async function startWaveformVisualization() {
            if (audioContext) return;
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioContext.createMediaStreamSource(stream);
                
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 32;
                source.connect(analyser);
                
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function updateWaveform() {
                    if (!analyser) return;
                    
                    analyser.getByteFrequencyData(dataArray);
                    
                    // Check if there's significant audio
                    const average = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
                    
                    if (average > 10) {
                        waveformContainer.classList.add('active');
                        listeningRing.classList.add('active');
                        
                        // Map frequency data to waveform bars
                        waveformBars.forEach((bar, i) => {
                            const value = dataArray[i % dataArray.length];
                            const height = 4 + (value / 255) * 26;
                            bar.style.height = `${height}px`;
                        });
                    } else {
                        waveformContainer.classList.remove('active');
                        listeningRing.classList.remove('active');
                    }
                    
                    waveformAnimationFrame = requestAnimationFrame(updateWaveform);
                }
                
                updateWaveform();
                console.log('✅ Waveform visualization started');
                
            } catch (error) {
                console.error('Failed to start waveform visualization:', error);
            }
        }
        
        function stopWaveformVisualization() {
            if (waveformAnimationFrame) {
                cancelAnimationFrame(waveformAnimationFrame);
                waveformAnimationFrame = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
                analyser = null;
            }
            waveformContainer.classList.remove('active');
            listeningRing.classList.remove('active');
        }
        
        // ============ Notification Reactions ============
        
        function triggerNotificationReaction(type) {
            if (!live2dModel) return;
            
            // Show notification indicator
            const emojis = {
                'message': '💬',
                'email': '📧',
                'calendar': '📅',
                'alert': '⚠️',
                'generic': '🔔'
            };
            
            notificationIndicator.textContent = emojis[type] || '🔔';
            notificationIndicator.classList.add('active');
            
            // Avatar looks toward notification (top-right)
            const startAngleX = currentAngleX;
            const startAngleY = currentAngleY;
            const targetX = 20;
            const targetY = -10;
            
            // Quick look animation
            const startTime = performance.now();
            const lookDuration = 300;
            const holdDuration = 800;
            const returnDuration = 400;
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                
                if (elapsed < lookDuration) {
                    // Look toward notification
                    const progress = elapsed / lookDuration;
                    const ease = 1 - Math.pow(1 - progress, 3);
                    setModelParameter('ParamAngleX', startAngleX + (targetX - startAngleX) * ease);
                    setModelParameter('ParamAngleY', startAngleY + (targetY - startAngleY) * ease);
                    setModelParameter('ParamEyeLOpen', 1.2); // Surprised eyes
                    setModelParameter('ParamEyeROpen', 1.2);
                } else if (elapsed < lookDuration + holdDuration) {
                    // Hold position, blink
                    if (elapsed > lookDuration + 200 && elapsed < lookDuration + 350) {
                        setModelParameter('ParamEyeLOpen', 0.2);
                        setModelParameter('ParamEyeROpen', 0.2);
                    } else {
                        setModelParameter('ParamEyeLOpen', 1);
                        setModelParameter('ParamEyeROpen', 1);
                    }
                } else if (elapsed < lookDuration + holdDuration + returnDuration) {
                    // Return to original position
                    const progress = (elapsed - lookDuration - holdDuration) / returnDuration;
                    const ease = progress * progress;
                    setModelParameter('ParamAngleX', targetX + (startAngleX - targetX) * ease);
                    setModelParameter('ParamAngleY', targetY + (startAngleY - targetY) * ease);
                } else {
                    // Done
                    notificationIndicator.classList.remove('active');
                    return;
                }
                
                requestAnimationFrame(animate);
            }
            
            requestAnimationFrame(animate);
            showStatus(`Notification: ${type}`, 1500);
        }
        
        // ============ Listening State ============
        
        function setListeningState(isListening) {
            if (isListening) {
                listeningRing.classList.add('active');
                startWaveformVisualization();
            } else {
                listeningRing.classList.remove('active');
                stopWaveformVisualization();
            }
        }

        // Init
        async function init() {
            console.log('🎭 Aria Desktop Avatar');
            
            // Set up accessibility features
            setupKeyboardNavigation();
            
            // Set up click interactions
            setupClickInteractions();
            
            // Set up modifier-key controls (Ctrl+drag, Ctrl+scroll)
            setupModifierControls();
            
            await initLive2D();
            connectWebSocket();
            
            // Start default movement mode
            updateMovementMode();
            
            // Set up settings synchronization
            if (window.electronAPI) {
                window.electronAPI.onSettingsUpdated((newSettings) => {
                    settings = newSettings;
                    // Update UI elements that depend on settings
                    updateUIFromSettings();
                });
            }
            
            // Heartbeat
            setInterval(() => {
                if (ws?.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 30000);
        }
        
        function updateUIFromSettings() {
            if (!settings) return;
            
            // Update movement mode
            if (settings.avatar?.movementMode && settings.avatar.movementMode !== movementMode) {
                movementMode = settings.avatar.movementMode;
                modeIndicator.textContent = movementMode;
                updateMovementMode();
            }
            
            // Update current maid
            if (settings.avatar?.currentMaid && settings.avatar.currentMaid !== currentMaid) {
                setCurrentMaid(settings.avatar.currentMaid);
                loadMaidModel(settings.avatar.currentMaid);
            }
            
            // Update model display settings
            if (live2dModel) {
                resizeModel();
            }
            
            // Update accessibility features
            updateAccessibilitySettings();
        }
        
        function updateAccessibilitySettings() {
            // Update high contrast mode if supported
            if (settings.accessibility?.highContrast) {
                document.body.classList.add('high-contrast');
            } else {
                document.body.classList.remove('high-contrast');
            }
            
            // Update reduced motion preference
            if (settings.accessibility?.reducedMotion) {
                document.body.classList.add('reduced-motion');
            } else {
                document.body.classList.remove('reduced-motion');
            }
        }
        
        // Listen for auto-hide settings changes
        if (window.electronAPI) {
            window.electronAPI.onAutoHideChanged((autoHide) => {
                setupAutoHide(autoHide);
            });
        }

        init();
    </script>
