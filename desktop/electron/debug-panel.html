<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Live2D Debug Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            -webkit-app-region: drag;
        }
        .header h1 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-controls {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        .header-btn {
            padding: 4px 8px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        .header-btn:hover { background: rgba(255,255,255,0.2); }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            overflow-x: auto;
        }
        .tab {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border: none;
            border-radius: 6px;
            color: #aaa;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .tab:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .tab.active { background: #ff6b9d; color: #fff; }
        
        /* Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Sections */
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #ff6b9d;
        }
        .section-actions {
            display: flex;
            gap: 4px;
        }
        
        /* Parameter Controls */
        .param-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }
        .param-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .param-name {
            flex: 0 0 140px;
            font-size: 11px;
            color: #aaa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .param-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
        }
        .param-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #ff6b9d;
            border-radius: 50%;
            cursor: pointer;
        }
        .param-value {
            flex: 0 0 40px;
            font-size: 11px;
            text-align: right;
            font-family: monospace;
        }
        
        /* Performance Monitor */
        .perf-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .perf-metric {
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 4px;
        }
        .perf-label {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
        }
        .perf-value {
            font-size: 18px;
            font-weight: 600;
            font-family: monospace;
        }
        .perf-graph {
            height: 60px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        
        /* Viewport Controls */
        .viewport-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .viewport-btn {
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        .viewport-btn:hover { background: rgba(255,255,255,0.2); }
        .viewport-btn:active { background: #ff6b9d; }
        
        /* Animation Controls */
        .animation-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .animation-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .animation-name {
            flex: 1;
            font-size: 12px;
        }
        .animation-controls {
            display: flex;
            gap: 4px;
        }
        .anim-btn {
            padding: 4px 8px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 3px;
            color: #fff;
            cursor: pointer;
            font-size: 10px;
        }
        .anim-btn:hover { background: rgba(255,255,255,0.2); }
        .anim-btn.active { background: #ff6b9d; }
        
        /* Grid Controls */
        .grid-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-label {
            flex: 0 0 80px;
            font-size: 11px;
            color: #aaa;
        }
        .control-input {
            flex: 1;
        }
        
        /* Toggle Switch */
        .toggle {
            position: relative;
            width: 40px;
            height: 20px;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            transition: 0.3s;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle input:checked + .toggle-slider { background: #ff6b9d; }
        .toggle input:checked + .toggle-slider:before { transform: translateX(20px); }
        
        /* Buttons */
        .btn {
            padding: 6px 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn-primary { background: #ff6b9d; }
        .btn-primary:hover { background: #ff5a8d; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 Live2D Debug Panel</h1>
        <div class="header-controls">
            <button class="header-btn" id="btn-import">📥 Import</button>
            <button class="header-btn" id="btn-export">📤 Export</button>
            <button class="header-btn" id="btn-dock">📌 Dock</button>
            <button class="header-btn" id="btn-close">✕</button>
        </div>
    </div>
    
    <div class="tabs">
        <button class="tab active" data-tab="parameters">Parameters</button>
        <button class="tab" data-tab="viewport">Viewport</button>
        <button class="tab" data-tab="animations">Animations</button>
        <button class="tab" data-tab="grid">Grid</button>
        <button class="tab" data-tab="performance">Performance</button>
        <button class="tab" data-tab="info">Model Info</button>
    </div>
    
    <div class="content">
        <!-- Parameters Tab -->
        <div id="parameters" class="tab-content active">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">Live2D Parameters</span>
                    <div class="section-actions">
                        <input type="text" id="param-search" placeholder="Search..." 
                            style="padding: 4px 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; font-size: 11px;">
                        <button class="btn" id="btn-reset-params">Reset All</button>
                    </div>
                </div>
                <div class="param-list" id="param-list">
                    <!-- Parameters will be populated dynamically -->
                </div>
            </div>
        </div>
        
        <!-- Viewport Tab -->
        <div id="viewport" class="tab-content">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">Viewport Controls</span>
                </div>
                <div class="viewport-controls">
                    <button class="viewport-btn" id="btn-pan-up">⬆️ Pan Up</button>
                    <button class="viewport-btn" id="btn-zoom-in">🔍 Zoom In</button>
                    <button class="viewport-btn" id="btn-rotate-left">↶ Rotate Left</button>
                    <button class="viewport-btn" id="btn-pan-left">⬅️ Pan Left</button>
                    <button class="viewport-btn" id="btn-reset-view">🎯 Reset</button>
                    <button class="viewport-btn" id="btn-pan-right">➡️ Pan Right</button>
                    <button class="viewport-btn" id="btn-rotate-right">↷ Rotate Right</button>
                    <button class="viewport-btn" id="btn-zoom-out">🔍 Zoom Out</button>
                    <button class="viewport-btn" id="btn-pan-down">⬇️ Pan Down</button>
                </div>
                <div style="margin-top: 12px; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px; font-size: 11px; font-family: monospace;">
                    <div>Position: <span id="viewport-pos">0, 0</span></div>
                    <div>Zoom: <span id="viewport-zoom">100%</span></div>
                    <div>Rotation: <span id="viewport-rotation">0°</span></div>
                </div>
            </div>
        </div>
        
        <!-- Animations Tab -->
        <div id="animations" class="tab-content">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">Animation Manager</span>
                </div>
                <div class="animation-list" id="animation-list">
                    <!-- Animations will be populated dynamically -->
                </div>
            </div>
        </div>
        
        <!-- Grid Tab -->
        <div id="grid" class="tab-content">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">Grid Overlay</span>
                </div>
                <div class="grid-controls">
                    <div class="control-row">
                        <span class="control-label">Enable Grid</span>
                        <label class="toggle">
                            <input type="checkbox" id="grid-enabled">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="control-row">
                        <span class="control-label">Grid Type</span>
                        <select id="grid-type" class="control-input" style="padding: 4px 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; font-size: 11px;">
                            <option value="lines">Lines</option>
                            <option value="dots">Dots</option>
                            <option value="crosshair">Crosshair</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <span class="control-label">Spacing</span>
                        <input type="range" id="grid-spacing" class="control-input" min="10" max="200" value="50">
                        <span id="grid-spacing-value" style="font-size: 11px; font-family: monospace;">50px</span>
                    </div>
                    <div class="control-row">
                        <span class="control-label">Opacity</span>
                        <input type="range" id="grid-opacity" class="control-input" min="10" max="100" value="30">
                        <span id="grid-opacity-value" style="font-size: 11px; font-family: monospace;">30%</span>
                    </div>
                    <div class="control-row">
                        <span class="control-label">Color</span>
                        <input type="color" id="grid-color" value="#ffffff" style="width: 100%; height: 30px; border: none; border-radius: 4px; cursor: pointer;">
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Performance Tab -->
        <div id="performance" class="tab-content">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">Performance Metrics</span>
                </div>
                <div class="perf-grid">
                    <div class="perf-metric">
                        <div class="perf-label">FPS</div>
                        <div class="perf-value" id="perf-fps">60</div>
                    </div>
                    <div class="perf-metric">
                        <div class="perf-label">Frame Time</div>
                        <div class="perf-value" id="perf-frametime">16ms</div>
                    </div>
                    <div class="perf-metric">
                        <div class="perf-label">Memory</div>
                        <div class="perf-value" id="perf-memory">0MB</div>
                    </div>
                    <div class="perf-metric">
                        <div class="perf-label">Draw Calls</div>
                        <div class="perf-value" id="perf-drawcalls">0</div>
                    </div>
                </div>
                <div class="perf-graph" id="perf-graph">
                    <canvas id="perf-canvas" style="width: 100%; height: 100%;"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Model Info Tab -->
        <div id="info" class="tab-content">
            <div id="model-info-container">
                <!-- ModelInfoPanel will be rendered here -->
            </div>
        </div>
    </div>
    
    <script type="module" src="debug-panel.js"></script>
</body>
</html>
